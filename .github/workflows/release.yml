name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: npm run smoke

      - name: Smoke test packed CLI
        run: npm run smoke:pack

      - name: Benchmark
        run: npm run benchmark

      - name: Release preflight
        run: npm run release:preflight

      - name: Install desktop UI dependencies
        if: env.NPM_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        run: npm --prefix desktop-ui-preview ci

      - name: Package desktop UI for Windows
        if: env.NPM_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        run: npm --prefix desktop-ui-preview run package:win

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Create GitHub release and upload desktop UI asset
        if: env.NPM_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="desktop-ui-preview/release/AGENTS.md-Doctor-win32-x64-${version}.zip"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

      - name: Skip npm publish without NPM_TOKEN
        if: env.NPM_TOKEN == ''
        run: |
          echo "::warning::NPM_TOKEN secret is not configured. Release gate passed, but npm publish was skipped."
          echo "Publish locally only as an explicit maintainer fallback, then add NPM_TOKEN before the next automated release."
