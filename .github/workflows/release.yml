name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate package and desktop asset
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: npm run smoke

      - name: Smoke test packed CLI
        run: npm run smoke:pack

      - name: Benchmark
        run: npm run benchmark

      - name: Release preflight
        run: npm run release:preflight

      - name: Install desktop UI dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: npm --prefix desktop-ui-preview ci

      - name: Smoke test desktop UI runtime
        if: startsWith(github.ref, 'refs/tags/')
        run: xvfb-run -a npm --prefix desktop-ui-preview run smoke:ci

      - name: Package desktop UI for Windows
        if: startsWith(github.ref, 'refs/tags/')
        run: npm --prefix desktop-ui-preview run package:win

      - name: Upload desktop UI asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: desktop-ui-win32-x64
          path: desktop-ui-preview/release/AGENTS.md-Doctor-win32-x64-*.zip
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release preflight
        run: npm run release:preflight

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not configured. Release gate passed, but npm publish was skipped."
            echo "Publish locally only as an explicit maintainer fallback, then add NPM_TOKEN before the next automated release."
            exit 0
          fi

          npm publish --provenance --access public

  github-release:
    name: Upload desktop UI release asset
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download desktop UI asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-ui-win32-x64
          path: desktop-ui-preview/release

      - name: Create GitHub release and upload desktop UI asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="desktop-ui-preview/release/AGENTS.md-Doctor-win32-x64-${version}.zip"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes --latest --repo "$GITHUB_REPOSITORY"
          fi
